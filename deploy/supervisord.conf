; Two processes, one container. supervisord is the init: it starts both, restarts
; either if it dies, and forwards their stdout to the container's, which is what
; `docker compose logs` reads.
[supervisord]
nodaemon=true
user=app
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; The site. SIGINT so axum drains in-flight requests before exiting.
[program:app]
command=/app/geekgallery
directory=/app
priority=10
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
stopsignal=INT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; The tunnel. Reads TUNNEL_TOKEN from the environment; reaches the app on
; loopback, so the container publishes no port at all.
[program:cloudflared]
command=cloudflared tunnel --no-autoupdate run
priority=20
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
